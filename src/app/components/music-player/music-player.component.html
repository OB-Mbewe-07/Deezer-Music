@if (service.track()) {
  <div
    class="fixed bottom-0 left-0 right-0 flex items-center justify-between px-6 py-3 z-50"
    style="border-top: 1px solid var(--p-inputtext-border-color); background: var(--p-inputtext-background);"
  >
    <div class="flex items-center gap-3 w-1/3">
      <img
        [src]="service.track()!.album.cover_small"
        class="w-10 h-10 rounded-lg object-cover"
        style="border: 1px solid var(--p-inputtext-border-color)"
      />
      <div class="flex flex-col min-w-0">
        <span class="text-sm font-medium truncate">{{ service.track()!.title }}</span>
        <span class="text-xs opacity-50 truncate">{{ service.track()!.artist.name }}</span>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <button
        class="w-8 h-8 rounded-full flex items-center justify-center cursor-pointer hover:opacity-70 transition-opacity"
        style="border: 1px solid var(--p-inputtext-border-color); background: transparent; color: var(--p-inputtext-color);"
      >
        <i class="pi pi-backward" style="font-size: 13px;"></i>
      </button>

      <button
        class="w-8 h-8 rounded-full flex items-center justify-center cursor-pointer hover:opacity-70 transition-opacity"
        style="border: 1px solid var(--p-inputtext-border-color); background: var(--p-inputtext-color); color: var(--p-inputtext-background);"
        (click)="service.togglePlay()"
      >
        <i [class]="service.isPlaying() ? 'pi pi-pause' : 'pi pi-play'" style="font-size: 13px;"></i>
      </button>

      <button
        class="w-8 h-8 rounded-full flex items-center justify-center cursor-pointer hover:opacity-70 transition-opacity"
        style="border: 1px solid var(--p-inputtext-border-color); background: transparent; color: var(--p-inputtext-color);"
      >
        <i class="pi pi-forward" style="font-size: 13px;"></i>
      </button>
    </div>


    <div class="flex items-center gap-2 w-1/3 justify-end">
      <span class="text-xs opacity-50">{{ service.currentTime() }} / {{ service.duration() }}</span>
    </div>
  </div>
}
