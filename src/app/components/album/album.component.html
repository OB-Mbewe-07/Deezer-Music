@if (album) {
  <div class="p-6">
    <div class="flex justify-center p-6 h-full">
      <div
        class="flex h-full flex-col gap-2 cursor-pointer hover:opacity-70 transition-opacity shrink-0 items-center m-[3%]"
        style="width: 120px"
      >
        <img
          [src]="album.cover_big"
          class="w-full rounded-xl object-cover h-full"
          style="border: 1px solid var(--p-inputtext-border-color)"
        />
        <h4 class="text-xl font-semibold truncate">{{ album.title }}</h4>
        <h5 class="text-base opacity-50 truncate">{{ album.artist?.name }}</h5>
      </div>
    </div>

    @if (tracks) {
      <section class="mb-8">
        <h2 class="text-lg font-semibold mb-3 opacity-60">Tracks</h2>
        <div
          class="flex flex-col"
          style="
            border: 1px solid var(--p-inputtext-border-color);
            border-radius: 16px;
            overflow: hidden;
          "
        >
          @for (track of tracks; track track.id; let last = $last) {
            <div
              class="flex items-center gap-4 px-4 py-3 cursor-pointer hover:opacity-70 transition-opacity"
              [style.border-bottom]="last ? 'none' : '1px solid var(--p-inputtext-border-color)'"
            >
              <img [src]="album.cover_small" class="w-10 h-10 rounded-lg object-cover" />
              <div class="flex flex-col flex-1 min-w-0">
                <span class="text-sm font-medium truncate">{{track.title}}</span>
                <span class="text-xs opacity-50 truncate">{{ track.artist.name }}</span>
              </div>
              <span class="text-xs opacity-40">{{ formatDuration(track.duration) }}</span>
            </div>
          }
        </div>
      </section>
    }
  </div>
}
